<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>站長瀏覽統計｜買房資訊王</title><style>body{font:16px/1.7 system-ui,sans-serif;background:#f8f5ed;color:#16322e;max-width:1000px;margin:32px auto;padding:0 20px}a{color:#0d4b45}table{width:100%;border-collapse:collapse;overflow-wrap:anywhere}th,td{text-align:left;border-bottom:1px solid #d7ded7;padding:10px}td:last-child,th:last-child{text-align:right}.table-wrap{overflow-x:auto}#status{font-weight:bold}</style></head><body><a href="/">← 回買房資訊王</a><h1>站長瀏覽統計</h1><p>只計算頁面瀏覽次數，不代表人數。台灣時間最近 90 個日曆日，沒有歷史回補資料；本站自 2026-10-12 開始計數。本報表限站長登入查看。未列出的日期代表沒有紀錄、無法判定，不是零；已記錄瀏覽亦可能包含過去驗收流量，不等於自然搜尋流量。</p><p>不保存訪客識別碼、IP、來源或瀏覽器資料。啟用 DNT / GPC、停用腳本及常見機器人的瀏覽可能不會計入。舊彙總於下一次成功計數時清除，無流量時實際刪除可能延後。</p><p id="status" role="status">正在讀取…</p><div class="table-wrap"><table><thead><tr><th>台灣日期</th><th>頁面</th><th>瀏覽次數</th></tr></thead><tbody id="rows"></tbody></table></div><script>fetch('/api/pageview-report',{credentials:'same-origin',cache:'no-store'}).then(async r=>{if(!r.ok)throw new Error();return r.json()}).then(data=>{document.getElementById('status').textContent=data.from+' 至 '+data.to+'：'+(data.rows.length?data.rows.reduce((a,r)=>a+r.views,0)+' 次已記錄瀏覽':'無法判定（期間沒有紀錄，不代表零訪客）')+'。資料庫讀取正常；不保證瀏覽器收集完整。查核時間：'+new Date(data.checked_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'});for(const row of data.rows){const tr=document.createElement('tr');for(const value of [row.day,row.path,row.views]){const td=document.createElement('td');td.textContent=value;tr.appendChild(td)}document.getElementById('rows').appendChild(tr)}}).catch(()=>{document.getElementById('status').textContent='暫時無法讀取統計，請稍後重試。'});</script></body></html>
